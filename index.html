<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Maps — Premium (Google)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0f1115;
      --panel: #181b22;
      --panel-2: #1f2430;
      --border: #2a303c;
      --text: #e8eaed;
      --muted: #9aa0a6;
      --accent: #8ab4f8;
      --accent-strong: #1a73e8;
      --success: #81c995;
      --danger: #f28b82;
      --shadow: 0 8px 32px rgba(0,0,0,0.45);
      --radius: 16px;
      --radius-sm: 10px;
      --font: "Inter", system-ui, -apple-system, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    #app {
      display: grid;
      grid-template-columns: 380px 1fr;
      height: 100%;
    }

    /* Sidebar */
    .sidebar {
      background: var(--panel);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      z-index: 1000;
      position: relative;
    }

    .sidebar-header {
      padding: 20px 20px 12px;
      border-bottom: 1px solid var(--border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }

    .brand-logo {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: linear-gradient(135deg, #1a73e8, #8ab4f8);
      display: grid;
      place-items: center;
      font-weight: 700;
      font-size: 14px;
      color: white;
      box-shadow: 0 4px 12px rgba(26,115,232,0.4);
    }

    .brand h1 {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .brand span {
      font-size: 11px;
      color: var(--muted);
      font-weight: 500;
      margin-left: auto;
      background: var(--panel-2);
      padding: 3px 8px;
      border-radius: 999px;
    }

    .search-box {
      position: relative;
    }

    .search-box input {
      width: 100%;
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 44px 12px 16px;
      color: var(--text);
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .search-box input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(138,180,248,0.15);
    }

    .search-box input::placeholder { color: var(--muted); }

    .search-btn {
      position: absolute;
      right: 6px;
      top: 50%;
      transform: translateY(-50%);
      width: 34px;
      height: 34px;
      border: none;
      border-radius: 8px;
      background: var(--accent-strong);
      color: white;
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: background 0.15s;
    }

    .search-btn:hover { background: #1557b0; }

    .search-results {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      right: 0;
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      max-height: 280px;
      overflow-y: auto;
      display: none;
      box-shadow: var(--shadow);
      z-index: 50;
    }

    .search-results.open { display: block; }

    .result-item {
      padding: 12px 16px;
      cursor: pointer;
      border-bottom: 1px solid var(--border);
      transition: background 0.1s;
    }

    .result-item:last-child { border-bottom: none; }
    .result-item:hover { background: rgba(138,180,248,0.08); }

    .result-item .name {
      font-size: 13.5px;
      font-weight: 500;
      margin-bottom: 2px;
    }

    .result-item .addr {
      font-size: 12px;
      color: var(--muted);
    }

    .sidebar-body {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
    }

    .section-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin-bottom: 10px;
    }

    .quick-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 24px;
    }

    .action-btn {
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 12px;
      color: var(--text);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: background 0.15s, border-color 0.15s;
      font-family: inherit;
    }

    .action-btn:hover {
      background: rgba(138,180,248,0.08);
      border-color: var(--accent);
    }

    .action-btn.active {
      background: rgba(26,115,232,0.2);
      border-color: var(--accent-strong);
      color: var(--accent);
    }

    .action-btn svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      opacity: 0.9;
    }

    .markers-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .marker-card {
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 12px 14px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      cursor: pointer;
      transition: border-color 0.15s;
    }

    .marker-card:hover { border-color: var(--accent); }

    .marker-pin {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--accent-strong);
      display: grid;
      place-items: center;
      flex-shrink: 0;
      font-size: 12px;
      font-weight: 700;
      color: white;
    }

    .marker-info { flex: 1; min-width: 0; }

    .marker-info .title {
      font-size: 13.5px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .marker-info .coords {
      font-size: 11.5px;
      color: var(--muted);
      margin-top: 2px;
      font-variant-numeric: tabular-nums;
    }

    .marker-remove {
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      padding: 4px;
      border-radius: 6px;
      opacity: 0.6;
      transition: opacity 0.15s, color 0.15s;
    }

    .marker-remove:hover { opacity: 1; color: var(--danger); }

    .empty-state {
      text-align: center;
      padding: 32px 16px;
      color: var(--muted);
      font-size: 13px;
    }

    .empty-state svg {
      width: 40px;
      height: 40px;
      margin-bottom: 12px;
      opacity: 0.4;
    }

    /* Map area */
    .map-wrap {
      position: relative;
      height: 100%;
    }

    #map {
      width: 100%;
      height: 100%;
      background: #1a1d24;
    }

    .map-controls {
      position: absolute;
      top: 16px;
      right: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 5;
    }

    .ctrl-btn {
      width: 42px;
      height: 42px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      cursor: pointer;
      display: grid;
      place-items: center;
      box-shadow: var(--shadow);
      transition: background 0.15s, transform 0.1s;
    }

    .ctrl-btn:hover { background: var(--panel-2); }
    .ctrl-btn:active { transform: scale(0.96); }
    .ctrl-btn.active { background: var(--accent-strong); border-color: var(--accent-strong); color: white; }

    .ctrl-btn svg { width: 20px; height: 20px; }

    .layers-panel {
      position: absolute;
      top: 16px;
      right: 70px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 8px;
      box-shadow: var(--shadow);
      display: none;
      z-index: 5;
      min-width: 170px;
    }

    .layers-panel.open { display: block; }

    .layer-option {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: background 0.1s;
    }

    .layer-option:hover { background: rgba(138,180,248,0.08); }
    .layer-option.active { background: rgba(26,115,232,0.2); color: var(--accent); }

    .layer-swatch {
      width: 18px;
      height: 18px;
      border-radius: 4px;
      border: 1px solid var(--border);
    }

    .status-bar {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 8px 18px;
      font-size: 12.5px;
      color: var(--muted);
      box-shadow: var(--shadow);
      z-index: 5;
      display: flex;
      align-items: center;
      gap: 12px;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .status-bar .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--success);
    }

    .toast {
      position: absolute;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--panel);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 12px 20px;
      border-radius: 12px;
      font-size: 13.5px;
      font-weight: 500;
      box-shadow: var(--shadow);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s, transform 0.25s;
      z-index: 10;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Hide default Google UI we don't need */
    .gm-style .gm-style-cc,
    .gm-bundled-control .gmnoprint { display: none !important; }

    @media (max-width: 800px) {
      #app { grid-template-columns: 1fr; }
      .sidebar {
        position: absolute;
        top: 0;
        left: 0;
        bottom: 0;
        width: min(340px, 90vw);
        transform: translateX(-100%);
        transition: transform 0.25s ease;
        z-index: 20;
      }
      .sidebar.open { transform: translateX(0); }
      .mobile-toggle { display: grid !important; }
    }

    .mobile-toggle {
      display: none;
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 10;
      width: 42px;
      height: 42px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      cursor: pointer;
      place-items: center;
      box-shadow: var(--shadow);
    }
  </style>
</head>
<body>
  <div id="app">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="brand">
          <div class="brand-logo">G</div>
          <h1>Maps</h1>
          <span>Google</span>
        </div>
        <div class="search-box">
          <input
            type="text"
            id="searchInput"
            placeholder="Search places, cities, addresses..."
            autocomplete="off"
            spellcheck="false"
          />
          <button class="search-btn" id="searchBtn" title="Search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" width="16" height="16">
              <circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>
            </svg>
          </button>
          <div class="search-results" id="searchResults"></div>
        </div>
      </div>

      <div class="sidebar-body">
        <div class="section-title">Quick Actions</div>
        <div class="quick-actions">
          <button class="action-btn" id="btnLocate">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>
              <circle cx="12" cy="12" r="8"/>
            </svg>
            My Location
          </button>
          <button class="action-btn" id="btnDropPin">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 21s-6-5.5-6-10a6 6 0 1 1 12 0c0 4.5-6 10-6 10z"/>
              <circle cx="12" cy="11" r="2"/>
            </svg>
            Drop Pin
          </button>
          <button class="action-btn" id="btnClear">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/>
            </svg>
            Clear All
          </button>
          <button class="action-btn" id="btnCopy">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="9" y="9" width="13" height="13" rx="2"/>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
            </svg>
            Copy Center
          </button>
        </div>

        <div class="section-title">Saved Places</div>
        <div class="markers-list" id="markersList">
          <div class="empty-state">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M12 21s-6-5.5-6-10a6 6 0 1 1 12 0c0 4.5-6 10-6 10z"/>
              <circle cx="12" cy="11" r="2"/>
            </svg>
            <div>No places yet</div>
            <div style="margin-top:6px;font-size:12px;opacity:0.7">Search or drop a pin on the map</div>
          </div>
        </div>
      </div>
    </aside>

    <div class="map-wrap">
      <button class="mobile-toggle" id="mobileToggle" title="Menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
          <path d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
      </button>

      <div id="map"></div>

      <div class="map-controls">
        <button class="ctrl-btn" id="btnLayers" title="Map style">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 2L2 7l10 5 10-5-10-5z"/>
            <path d="M2 17l10 5 10-5M2 12l10 5 10-5"/>
          </svg>
        </button>
        <button class="ctrl-btn" id="btnFullscreen" title="Fullscreen">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
          </svg>
        </button>
      </div>

      <div class="layers-panel" id="layersPanel">
        <div class="layer-option" data-layer="roadmap">
          <div class="layer-swatch" style="background:linear-gradient(135deg,#a8c5e2,#5a7a9a)"></div>
          Roadmap
        </div>
        <div class="layer-option active" data-layer="satellite">
          <div class="layer-swatch" style="background:linear-gradient(135deg,#2a4a2a,#0a1a0a)"></div>
          Satellite
        </div>
        <div class="layer-option" data-layer="hybrid">
          <div class="layer-swatch" style="background:linear-gradient(135deg,#3a5a3a,#1a3a1a)"></div>
          Hybrid
        </div>
        <div class="layer-option" data-layer="terrain">
          <div class="layer-swatch" style="background:linear-gradient(135deg,#c4b59d,#8a7a5a)"></div>
          Terrain
        </div>
      </div>

      <div class="status-bar" id="statusBar">
        <span class="dot"></span>
        <span id="statusCoords">—</span>
        <span style="opacity:0.4">|</span>
        <span id="statusZoom">Zoom —</span>
      </div>

      <div class="toast" id="toast"></div>
    </div>
  </div>

  <!-- Official Google Maps JavaScript API with your key -->
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDQXAhnouB23QWGRAchHsdg9XcVDn-fdUg&libraries=places&callback=initMap" async defer></script>

  <script>
    // ─────────────────────────────────────────────
    //  PREMIUM GOOGLE MAPS ENGINE
    //  Using official Google Maps JavaScript API
    // ─────────────────────────────────────────────

    let map, markers = [], dropMode = false, markerId = 0;
    let placesService, autocompleteService;

    const $ = (sel) => document.querySelector(sel);
    const searchInput   = $("#searchInput");
    const searchResults = $("#searchResults");
    const markersList   = $("#markersList");
    const statusCoords  = $("#statusCoords");
    const statusZoom    = $("#statusZoom");
    const toastEl       = $("#toast");
    const layersPanel   = $("#layersPanel");
    const sidebar       = $("#sidebar");

    // ── Init (called by Google Maps callback) ─────
    function initMap() {
      map = new google.maps.Map(document.getElementById("map"), {
        center: { lat: 37.7749, lng: -122.4194 },
        zoom: 13,
        mapTypeId: "satellite",
        disableDefaultUI: true,
        zoomControl: true,
        zoomControlOptions: {
          position: google.maps.ControlPosition.RIGHT_BOTTOM
        },
        gestureHandling: "greedy",
        styles: [] // keep clean Google look
      });

      placesService = new google.maps.places.PlacesService(map);
      autocompleteService = new google.maps.places.AutocompleteService();

      // Live coordinates
      map.addListener("mousemove", (e) => {
        if (e.latLng) {
          statusCoords.textContent = `${e.latLng.lat().toFixed(5)}, ${e.latLng.lng().toFixed(5)}`;
        }
      });

      map.addListener("zoom_changed", updateStatus);
      map.addListener("center_changed", updateStatus);

      // Drop pin on click when mode active
      map.addListener("click", (e) => {
        if (dropMode && e.latLng) {
          addMarker(e.latLng.lat(), e.latLng.lng(), "Dropped Pin");
          dropMode = false;
          $("#btnDropPin").classList.remove("active");
          toast("Pin dropped");
        }
      });

      // Double-click quick pin
      map.addListener("dblclick", (e) => {
        if (e.latLng) addMarker(e.latLng.lat(), e.latLng.lng(), "Quick Pin");
      });

      updateStatus();

      // Welcome pin
      setTimeout(() => {
        addMarker(37.7749, -122.4194, "San Francisco", false);
        toast("Google Maps ready — Satellite mode");
      }, 500);
    }

    function updateStatus() {
      if (!map) return;
      const c = map.getCenter();
      statusCoords.textContent = `${c.lat().toFixed(5)}, ${c.lng().toFixed(5)}`;
      statusZoom.textContent = `Zoom ${map.getZoom()}`;
    }

    // ── Markers ───────────────────────────────────
    function addMarker(lat, lng, title = "Place", fly = true) {
      markerId += 1;
      const id = markerId;

      const marker = new google.maps.Marker({
        position: { lat, lng },
        map,
        title,
        label: {
          text: String(id),
          color: "white",
          fontWeight: "700",
          fontSize: "12px"
        },
        animation: google.maps.Animation.DROP,
        draggable: true
      });

      const info = new google.maps.InfoWindow({
        content: `<div style="font-family:Inter,sans-serif;padding:4px 2px;min-width:140px">
          <strong style="font-size:14px">${escapeHtml(title)}</strong><br>
          <span style="color:#5f6368;font-size:12px">${lat.toFixed(5)}, ${lng.toFixed(5)}</span>
        </div>`
      });

      marker.addListener("click", () => info.open(map, marker));

      marker.addListener("dragend", () => {
        const pos = marker.getPosition();
        const m = markers.find(m => m.id === id);
        if (m) {
          m.lat = pos.lat();
          m.lng = pos.lng();
          renderMarkersList();
        }
      });

      markers.push({ id, lat, lng, title, marker, info });
      renderMarkersList();

      if (fly) {
        map.panTo({ lat, lng });
        if (map.getZoom() < 15) map.setZoom(15);
      }
      return id;
    }

    function removeMarker(id) {
      const idx = markers.findIndex(m => m.id === id);
      if (idx === -1) return;
      markers[idx].marker.setMap(null);
      markers.splice(idx, 1);
      renderMarkersList();
    }

    function clearAllMarkers() {
      markers.forEach(m => m.marker.setMap(null));
      markers = [];
      renderMarkersList();
      toast("All places cleared");
    }

    function renderMarkersList() {
      if (markers.length === 0) {
        markersList.innerHTML = `
          <div class="empty-state">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M12 21s-6-5.5-6-10a6 6 0 1 1 12 0c0 4.5-6 10-6 10z"/>
              <circle cx="12" cy="11" r="2"/>
            </svg>
            <div>No places yet</div>
            <div style="margin-top:6px;font-size:12px;opacity:0.7">Search or drop a pin on the map</div>
          </div>`;
        return;
      }

      markersList.innerHTML = markers.map(m => `
        <div class="marker-card" data-id="${m.id}">
          <div class="marker-pin">${m.id}</div>
          <div class="marker-info">
            <div class="title">${escapeHtml(m.title)}</div>
            <div class="coords">${m.lat.toFixed(5)}, ${m.lng.toFixed(5)}</div>
          </div>
          <button class="marker-remove" data-remove="${m.id}" title="Remove">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M18 6L6 18M6 6l12 12"/>
            </svg>
          </button>
        </div>
      `).join("");

      markersList.querySelectorAll(".marker-card").forEach(card => {
        card.addEventListener("click", (e) => {
          if (e.target.closest("[data-remove]")) return;
          const id = +card.dataset.id;
          const m = markers.find(x => x.id === id);
          if (m) {
            map.panTo({ lat: m.lat, lng: m.lng });
            map.setZoom(16);
            m.info.open(map, m.marker);
          }
        });
      });

      markersList.querySelectorAll("[data-remove]").forEach(btn => {
        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          removeMarker(+btn.dataset.remove);
        });
      });
    }

    // ── Google Places Search ──────────────────────
    let searchTimeout = null;

    function searchPlaces(query) {
      if (!query || query.length < 2) {
        searchResults.classList.remove("open");
        return;
      }

      autocompleteService.getPlacePredictions(
        { input: query, types: ["geocode", "establishment"] },
        (predictions, status) => {
          if (status !== google.maps.places.PlacesServiceStatus.OK || !predictions) {
            searchResults.innerHTML = `<div class="result-item"><div class="name">No results</div></div>`;
            searchResults.classList.add("open");
            return;
          }

          searchResults.innerHTML = predictions.slice(0, 6).map(p => `
            <div class="result-item" data-place-id="${p.place_id}" data-name="${escapeHtml(p.structured_formatting.main_text)}">
              <div class="name">${escapeHtml(p.structured_formatting.main_text)}</div>
              <div class="addr">${escapeHtml(p.description)}</div>
            </div>
          `).join("");

          searchResults.classList.add("open");

          searchResults.querySelectorAll(".result-item").forEach(el => {
            el.addEventListener("click", () => {
              const placeId = el.dataset.placeId;
              const name = el.dataset.name;

              placesService.getDetails(
                { placeId, fields: ["geometry", "name", "formatted_address"] },
                (place, status) => {
                  if (status === google.maps.places.PlacesServiceStatus.OK && place.geometry) {
                    const lat = place.geometry.location.lat();
                    const lng = place.geometry.location.lng();
                    addMarker(lat, lng, place.name || name);
                    searchResults.classList.remove("open");
                    searchInput.value = place.name || name;
                  }
                }
              );
            });
          });
        }
      );
    }

    // ── Geolocation ───────────────────────────────
    function locateMe() {
      if (!navigator.geolocation) {
        toast("Geolocation not supported");
        return;
      }
      toast("Locating…");
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const { latitude, longitude } = pos.coords;
          addMarker(latitude, longitude, "My Location");
          toast("Location found");
        },
        () => toast("Unable to get location")
      );
    }

    // ── Utils ─────────────────────────────────────
    function toast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add("show");
      clearTimeout(toastEl._timer);
      toastEl._timer = setTimeout(() => toastEl.classList.remove("show"), 2200);
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function copyCenter() {
      const c = map.getCenter();
      const text = `${c.lat().toFixed(6)}, ${c.lng().toFixed(6)}`;
      navigator.clipboard.writeText(text).then(() => {
        toast("Coordinates copied");
      }).catch(() => toast(text));
    }

    function setMapType(type) {
      map.setMapTypeId(type);
      document.querySelectorAll(".layer-option").forEach(el => {
        el.classList.toggle("active", el.dataset.layer === type);
      });
    }

    // ── Event wiring ──────────────────────────────
    searchInput.addEventListener("input", () => {
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(() => searchPlaces(searchInput.value.trim()), 280);
    });

    searchInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        searchPlaces(searchInput.value.trim());
      }
      if (e.key === "Escape") searchResults.classList.remove("open");
    });

    $("#searchBtn").addEventListener("click", () => {
      searchPlaces(searchInput.value.trim());
    });

    document.addEventListener("click", (e) => {
      if (!e.target.closest(".search-box")) {
        searchResults.classList.remove("open");
      }
    });

    $("#btnLocate").addEventListener("click", locateMe);

    $("#btnDropPin").addEventListener("click", () => {
      dropMode = !dropMode;
      $("#btnDropPin").classList.toggle("active", dropMode);
      toast(dropMode ? "Click map to drop pin" : "Drop mode off");
    });

    $("#btnClear").addEventListener("click", clearAllMarkers);
    $("#btnCopy").addEventListener("click", copyCenter);

    $("#btnLayers").addEventListener("click", (e) => {
      e.stopPropagation();
      layersPanel.classList.toggle("open");
    });

    document.addEventListener("click", (e) => {
      if (!e.target.closest("#layersPanel") && !e.target.closest("#btnLayers")) {
        layersPanel.classList.remove("open");
      }
    });

    document.querySelectorAll(".layer-option").forEach(el => {
      el.addEventListener("click", () => {
        setMapType(el.dataset.layer);
        layersPanel.classList.remove("open");
      });
    });

    $("#btnFullscreen").addEventListener("click", () => {
      const el = document.documentElement;
      if (!document.fullscreenElement) {
        el.requestFullscreen?.();
      } else {
        document.exitFullscreen?.();
      }
    });

    $("#mobileToggle").addEventListener("click", () => {
      sidebar.classList.toggle("open");
    });

    document.getElementById("map").addEventListener("click", () => {
      if (window.innerWidth <= 800) sidebar.classList.remove("open");
    });
  </script>
</body>
</html>
